<!DOCTYPE html>
 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umair Hussain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --main: #0F5C5C;
    --ink: #111318;
    --bg: #FAFAF8;
    --accent: #E8A33D;
    --muted: #5B5F6A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    text-align: center;
    padding: 24px;
  }
  .mark {
    width: 64px;
    height: 64px;
    background: var(--main);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
  }
  .mark span {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--bg);
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 44px);
    margin: 0 0 12px 0;
  }
  p.tag {
    color: var(--muted);
    font-size: 17px;
    max-width: 480px;
    margin: 0 0 28px 0;
    line-height: 1.5;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    border: 1px solid #E4E2DB;
    padding: 6px 14px;
    border-radius: 999px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }
</style>
</head>
<body>
  <div class="mark"><span>UH</span></div>
  <h1>Umair Hussain</h1>
  <p class="tag">Ships AI ideas from zero to working products, alone. Building the full site next — starting with RxBuddy PK.</p>
  <div class="status"><span class="dot"></span> Portfolio in progress</div>
</body>
</html>
